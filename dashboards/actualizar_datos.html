<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080D26">
  <title>Actualizar mis datos · Aurora Libris</title>

  <link rel="icon" type="image/svg+xml" href="../iconos/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/index.css" rel="stylesheet">
  <link href="/css/login.css" rel="stylesheet">
  <link href="/css/actualizar_datos.css" rel="stylesheet">
</head>
<body>

  <div class="cielo" aria-hidden="true">
    <span class="banda b1"></span>
    <span class="banda b2"></span>
    <span class="banda b3"></span>
  </div>

  <nav class="navbar navbar-expand-lg fixed-top nav-aurora" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="actualizar_datos.html">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8FD3FF"/>
              <stop offset="1" stop-color="#7C5CF2"/>
            </linearGradient>
          </defs>
          <path d="M3 24c4-10 9-15 13-15s9 5 13 15" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M8 25c3-6 6-9 8-9s5 3 8 9" stroke="url(#lg)" stroke-width="2.4" stroke-linecap="round" opacity=".6"/>
          <path d="M4 28h24" stroke="#C9BEFF" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span>Aurora Libris</span>
      </a>

      <button class="navbar-toggler border-0" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu"
              aria-controls="menu" aria-expanded="false"
              aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav mx-lg-auto gap-lg-3">
          <li class="nav-item">
            <a class="nav-link" href="tabla_posiciones.html">Tabla de posiciones</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="vr.html">Realidad virtual</a>
          </li>
        </ul>

        <div class="d-flex gap-2 mt-3 mt-lg-0">
          <a class="btn btn-ghost" href="usuario.html" id="btnVolver">Volver al dashboard</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="login-pagina actualizar-pagina">
    <div class="container">
      <div class="panel login-card actualizar-card">

        <div class="text-center">
          <span class="rol-icono" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round"
                 stroke-linejoin="round">
              <circle cx="10" cy="8" r="4"/>
              <path d="M2.5 20c1.4-4 4.2-6 7.5-6s6.1 2 7.5 6"/>
              <path d="M19 7v6M16 10h6"/>
            </svg>
          </span>

          <h1 class="login-titulo">Actualizar mis datos</h1>
          <p class="login-sub">
            Mantén tu información personal al día.
          </p>
        </div>

        <div id="mensajeFormulario" class="alerta-formulario"
             role="status" aria-live="polite" hidden></div>

        <form id="formActualizarDatos" class="mt-4" novalidate>
          <div class="fila-2">
            <div class="campo">
              <label for="nombre">Nombre</label>
              <div class="campo-in">
                <svg class="ico" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
                </svg>
                <input type="text" id="nombre" name="nombre"
                       maxlength="80" autocomplete="given-name"
                       aria-describedby="errNombre" required>
              </div>
              <p class="error" id="errNombre" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="apellido">Apellido</label>
              <div class="campo-in">
                <svg class="ico" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
                </svg>
                <input type="text" id="apellido" name="apellido"
                       maxlength="80" autocomplete="family-name"
                       aria-describedby="errApellido" required>
              </div>
              <p class="error" id="errApellido" aria-live="polite"></p>
            </div>
          </div>

          <div class="campo">
            <label for="celular">Celular</label>
            <div class="campo-in">
              <svg class="ico" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <rect x="7" y="2.5" width="10" height="19" rx="2.5"/>
                <path d="M11 18.5h2"/>
              </svg>
              <span class="prefijo" aria-hidden="true">+57</span>
              <input type="tel" id="celular" name="celular"
                     class="con-prefijo" maxlength="10"
                     inputmode="numeric" autocomplete="tel-national"
                     aria-describedby="errCelular" required>
            </div>
            <p class="error" id="errCelular" aria-live="polite"></p>
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico</label>
            <div class="campo-in">
              <svg class="ico" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round"
                   aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3"/>
                <path d="M4 8l8 6 8-6"/>
              </svg>
              <input type="email" id="correo" name="correo"
                     maxlength="254" autocomplete="email"
                     aria-describedby="errCorreo" required>
            </div>
            <p class="error" id="errCorreo" aria-live="polite"></p>
          </div>

          <fieldset class="campo" aria-describedby="errSexo">
            <legend>Sexo</legend>
            <div class="pills">
              <input type="radio" name="sexo" id="sexoF"
                     value="femenino">
              <label for="sexoF">Femenino</label>

              <input type="radio" name="sexo" id="sexoM"
                     value="masculino">
              <label for="sexoM">Masculino</label>

              <input type="radio" name="sexo" id="sexoN"
                     value="no_indica">
              <label for="sexoN">Prefiero no decirlo</label>
            </div>
            <p class="error" id="errSexo" aria-live="polite"></p>
          </fieldset>

          <div class="actualizar-acciones">
            <button type="submit" class="btn btn-aurora btn-lg"
                    id="btnGuardar" disabled>
              <span class="spinner-border spinner-border-sm me-2 d-none"
                    id="spin" aria-hidden="true"></span>
              Guardar cambios
            </button>

            <button type="button" class="btn btn-ghost btn-lg"
                    id="btnCancelar">
              Cancelar
            </button>
          </div>
        </form>

        <p class="actualizar-nota">
          Tu contraseña y tus permisos no se modifican desde este formulario.
        </p>
      </div>
    </div>
  </main>

  <footer class="pie">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>Aurora Libris</span>
      <span>© <span id="anio"></span> · Proyecto de POO 2</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/actualizar_datos.js"></script>
</body>
</html>
